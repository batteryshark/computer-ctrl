[project]
name = "cctl"
version = "0.1.0"
description = "Harness-agnostic computer-use toolkit: one tool contract served over MCP and a CLI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
    "psutil>=5.9",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1"]
audio = ["soundcard>=0.4.3; sys_platform == 'win32'"]   # WASAPI loopback + mic on Windows

[project.scripts]
cctl = "cctl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctl"]

[tool.hatch.build.targets.wheel.force-include]
"contract/tools.json" = "cctl/tools.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a live desktop (run on the target machine)"]
addopts = "-m 'not e2e'"
